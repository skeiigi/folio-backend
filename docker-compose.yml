services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio_dev_only
      POSTGRES_DB: folio
    ports:
      - "5432:5432"
    volumes:
      - folio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  folio-postgres:
